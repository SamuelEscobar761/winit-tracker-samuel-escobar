[project]
name = "cap-backend"
version = "0.1.0"
description = "Backend of the California Court Case Tracker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "playwright>=1.45",
  "pillow>=10.1",
  "anthropic>=1.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ERA"]

[tool.ruff.lint.per-file-ignores]
"app/replica/page.py" = ["E501"]
"tests/**" = ["SIM117"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
