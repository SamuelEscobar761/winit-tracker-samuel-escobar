services:
  backend:
    build: ./cap-backend
    environment:
      CAP_PROVIDER: ${CAP_PROVIDER:-replica}
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0.08}
      REPLICA_CAPTCHA_RATE: ${REPLICA_CAPTCHA_RATE:-0.1}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MAX_WORKERS: ${MAX_WORKERS:-3}
      CAP_ACTION_DELAY_SECONDS: ${CAP_ACTION_DELAY_SECONDS:-5}
      CAP_MAX_ACTIONS_PER_MINUTE: ${CAP_MAX_ACTIONS_PER_MINUTE:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_OFFLINE_MOCK: ${AI_OFFLINE_MOCK:-false}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_RULES_AUTO_APPLY: ${AI_RULES_AUTO_APPLY:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - portal-rules:/data/rules
    expose:
      - "8000"
    init: true
    shm_size: "1gb"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  frontend:
    build: ./cap-frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  portal-rules:
